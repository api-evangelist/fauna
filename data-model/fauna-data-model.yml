identifiers:
  cursor:
    shape: opaque string
    used_by: [EventFeedRequest.cursor, EventFeedResponse.cursor, Event.cursor]
    detail: The only cross-request identifier in the contract. Opaque; no documented prefix or format.
  txn_ts:
    shape: int64 microsecond transaction timestamp
    used_by: [QueryResponse, ErrorResponse, Event, EventFeedRequest.start_ts]
    detail: >-
      Fauna's ordering primitive and the closest thing the API has to a global version. It
      doubles as a resume point: a feed can be restarted from a start_ts to avoid missing
      events across a disconnection.
  document_id:
    shape: not in the transport contract
    detail: >-
      Fauna document ids exist, but they live inside FQL results as user-schema data. No
      OpenAPI schema declares one, so no id-prefix taxonomy can be derived.
summary:
  entity_count: 18
  relationship_count: 10
  finding: >-
    Sixteen of the eighteen entities are request/response envelopes or value objects; only
    Event and SchemaFile are domain entities. There is no collection, document, index, role
    or key resource in the public contract, which is the honest shape of a database-as-an-API
    and not a gap in the harvest.
