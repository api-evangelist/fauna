provider: Fauna
providerId: fauna
description: >-
  The entity graph of the Fauna Core HTTP API's TRANSPORT contract. This is deliberately a
  small graph, and the reason is the interesting finding: Fauna is a database, so its real
  data model is whatever FSL schema the CUSTOMER defines. The public API describes the
  envelopes that carry queries, events and schema files — not collections, documents,
  indexes or roles, none of which appear as components.schemas anywhere in the contract. An
  ERD derived from this spec therefore describes the wire protocol, not the database.
entities:
- name: QueryRequest
  role: request envelope
  operations: [executeQuery]
  fields: [query, arguments, typecheck, format]
- name: QueryResponse
  role: response envelope
  operations: [executeQuery]
  fields: [data, static_type, summary, txn_ts, stats, schema_version]
- name: QueryStats
  role: value object
  detail: Per-request metering — compute/read/write ops, query_time_ms, attempts, retries, storage bytes.
- name: EventFeedRequest
  role: request envelope
  operations: [pollEventFeed]
  fields: [token, cursor, start_ts, page_size]
- name: EventFeedResponse
  role: response envelope
  operations: [pollEventFeed]
  fields: [events, cursor, has_next, stats]
- name: Event
  role: entity
  detail: 'One change-data-capture record: type (add|remove|update), data, txn_ts, cursor, stats.'
- name: EventStats
  role: value object
- name: SchemaFile
  role: entity
  detail: One FSL source file — filename plus content.
- name: SchemaFilesResponse
  role: collection response
  operations: [getSchemaFiles]
- name: SchemaUpdateResponse
  role: response envelope
  operations: [updateSchemaFiles]
- name: SchemaValidationResponse
  role: response envelope
  operations: [validateSchemaFiles]
- name: SchemaStatusResponse
  role: response envelope
  operations: [getStagedSchemaStatus]
- name: SchemaCommitResponse
  role: response envelope
  operations: [commitStagedSchema]
- name: SchemaAbandonResponse
  role: response envelope
  operations: [abandonStagedSchema]
- name: ErrorResponse
  role: error envelope
  detail: Shared by every 4xx across all four specs. See errors/fauna-problem-types.yml.
- name: GraphQLRequest
  role: request envelope
  operations: [executeGraphQLQuery]
  provenance_note: >-
    From the GraphQL spec, which is NOT present in openapi/_original/. Recorded, but its
    authorship is unconfirmed — see provenance.yml.
- name: GraphQLResponse
  role: response envelope
  operations: [executeGraphQLQuery]
  provenance_note: Same caveat as GraphQLRequest.
