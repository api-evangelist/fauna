specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Fauna
providerId: fauna
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Database
  - Document Database
  - Serverless
  - Rate Limiting
  - End of Service
description: Fauna announced End-of-Service in March 2025 and fully shut down its hosted service on May
  30, 2025. Historically Fauna throttled by Transactional Operations (TROs / TWOs / TCOs) on a per-database
  basis with per-plan ceilings, and exposed standard 429 responses. The service is no longer accepting
  traffic; this artifact preserves the historical rate-limiting shape for archival purposes.
notes: Service discontinued May 30, 2025. Historical limits are not actionable.
sources:
  - https://fauna.com/blog/announcing-fauna-end-of-service
  - https://docs.fauna.com/fauna/current/learn/limits/
responseCodes:
  throttled: 429
  serverError: 500
  serviceUnavailable: 503
limits:
  - name: Transactional Read Operations (TROs) per database (historical)
    scope: database
    metric: operations
    limit: per-plan ceiling; Free included 100K/day; paid plans metered
    notes: Historical; service discontinued May 30, 2025.
  - name: Transactional Write Operations (TWOs) per database (historical)
    scope: database
    metric: operations
    limit: per-plan ceiling; Free included 50K/day; paid plans metered
    notes: Historical; service discontinued May 30, 2025.
  - name: Transactional Compute Operations (TCOs) per database (historical)
    scope: database
    metric: operations
    limit: per-plan ceiling; Free included 50K/day; paid plans metered
    notes: Historical; service discontinued May 30, 2025.
  - name: Storage per database (historical)
    scope: database
    metric: GB
    limit: Free included 5GB; paid plans metered per-GB-month
    notes: Historical; service discontinued May 30, 2025.
policies:
  - name: End of Service
    description: 'Fauna service was decommissioned on 2025-05-30. New signups closed in March 2025; existing
      tenants were given a migration window. This rate-limit artifact is archival.'
  - name: Historical retry pattern
    description: When operational, Fauna returned 429 with Retry-After on quota exhaustion; clients should
      have used exponential backoff with jitter.
  - name: Historical idempotency
    description: Fauna FQL transactions were ACID and idempotent within a single transaction; retries
      of the same FQL were safe.
maintainers:
