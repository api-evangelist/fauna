specification: FinOps Framework
specificationVersion: '1.0'
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Fauna
providerId: fauna
publisherName: Fauna, Inc.
serviceCategory: Database / Serverless
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Database
  - Document Database
  - Serverless
  - End of Service
  - FinOps
  - Cost Management
  - FOCUS
description: 'FOCUS-aligned FinOps for Fauna (archival). Fauna service was decommissioned on 2025-05-30
  following a March 2025 End-of-Service announcement. Historically Fauna billed usage-based on TROs (Transactional
  Read Operations), TWOs (Transactional Write Operations), TCOs (Transactional Compute Operations), storage
  (GB-month), and outbound transfer (GB), with optional monthly platform fees on Team / Business plans.
  This artifact preserves the FinOps shape for cost-archive and migration accounting purposes.'
notes: Fauna End-of-Service 2025-05-30. FinOps levers below are archival; for live workloads see migration
  guidance.
sources:
  - https://fauna.com/blog/announcing-fauna-end-of-service
  - https://fauna.com/pricing
principles:
  - name: Visibility
    description: Historically — pull TRO/TWO/TCO/storage usage from the Fauna Dashboard or the /usage
      API endpoints; reconcile against monthly invoice. Now archival.
  - name: Allocation
    description: Historically — allocate by Fauna database (each database had its own usage counters);
      tag with team/product. Now archival.
  - name: Optimization
    description: Historical levers were — index design (avoid full-collection scans that drove TROs);
      batch FQL queries; minimize streaming subscriptions; choose region carefully to limit egress.
  - name: Accountability
    description: Historically the data platform team owned Fauna entitlement; per-database owners owned
      usage. Now — accountability shifts to migration completion and shutdown reconciliation.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
  - name: Optimize Usage and Cost
    capabilities:
      - Architecting for Cloud
      - Workload Optimization
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - Onboarding Workloads
      - Invoicing and Chargeback
billingModel:
  pricingCategory: Usage-Based (Discontinued)
  billingFrequency: Monthly (historical)
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Adjustment
    - Refund
  chargeFrequency: Recurring (historical)
focusColumns:
  ServiceName: Fauna
  ServiceCategory: Database / Serverless
  ProviderName: Fauna
  PublisherName: Fauna, Inc.
  InvoiceIssuerName: Fauna, Inc.
  PricingCategory: Usage-Based (discontinued)
  PricingUnit: operation | GB
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: tros
    description: Transactional Read Operations.
    unit: operation
    aggregation: sum
    dimensions:
      - database
      - region
  - name: twos
    description: Transactional Write Operations.
    unit: operation
    aggregation: sum
    dimensions:
      - database
      - region
  - name: tcos
    description: Transactional Compute Operations.
    unit: operation
    aggregation: sum
    dimensions:
      - database
      - region
  - name: storage_gb_month
    description: Stored data per GB-month.
    unit: GB-month
    aggregation: sum
    dimensions:
      - database
      - region
  - name: egress_gb
    description: Outbound data transfer.
    unit: GB
    aggregation: sum
    dimensions:
      - database
      - region
apis:
  - name: Fauna Core HTTP API
    baseURL: https://db.fauna.com
    serviceName: Fauna Core HTTP API
    serviceCategory: API
  - name: Fauna GraphQL API
    baseURL: https://graphql.fauna.com
    serviceName: Fauna GraphQL API
    serviceCategory: API
  - name: Fauna Event Streaming API
    baseURL: https://db.fauna.com
    serviceName: Fauna Event Streaming API
    serviceCategory: API
unitEconomics:
  - name: Cost per 1M TROs (historical)
    metric: tro_cost / (tros / 1000000)
    target: see fauna.com/pricing snapshot
  - name: Cost per 1M TWOs (historical)
    metric: two_cost / (twos / 1000000)
    target: see fauna.com/pricing snapshot
