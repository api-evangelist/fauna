description: Fauna, Inc. built a distributed document-relational database delivered as a cloud API, combining 
  the relational query power of SQL with the flexibility of documents, global serverless distribution and 
  strictly serializable ACID transactions over plain HTTPS. Fauna announced End-of-Service in March 2025 and 
  shut the hosted service down on 2025-05-30; as of 2026-09-17 every Fauna service host returns NXDOMAIN and 
  the apex domain forwards to an unrelated company. This profile is maintained as an archival record of the 
  API surface as it stood at shutdown.
