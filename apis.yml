  description: >-
    The Fauna .NET Driver is the official client SDK for interacting with Fauna from C# and .NET applications.
    It is designed for use with FQL v10 and provides strongly-typed query construction and response handling.
    The driver enables .NET developers to perform document operations, run queries, and manage database
    resources using familiar C# patterns and conventions.
