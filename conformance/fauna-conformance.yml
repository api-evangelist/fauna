domain_standard:
  applicable: false
  detail: >-
    REWARD-ONLY and honestly not applicable. The general-purpose operational-database market
    has no interchange standard a vendor could declare in its contract — there is no SCIM,
    OpenRTB, HL7 or ISO 20022 equivalent for "document-relational database as an API". The
    nearest neighbours are query languages rather than wire standards, and Fauna's is FQL,
    which is its own proprietary language. No domain standard is asserted and none should be
    invented to fill the slot.
